<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="无需安装、打开即玩的经典贪吃蛇 H5 小游戏。" />
    <title>贪吃蛇 · 经典 H5</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M10 34h22V22h22v20H32v-8z' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#board">跳到棋盘</a>

    <main class="game-shell" id="game-shell" data-state="idle">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Classic arcade</p>
          <h1>贪吃蛇</h1>
          <p class="tagline">吃下光点，别碰墙，也别咬到自己。</p>
        </div>

        <div class="topbar-actions">
          <div class="stats" id="stats" role="status" aria-live="polite" aria-atomic="true">
            <div class="stat">
              <span class="stat-label">得分</span>
              <strong class="stat-value" id="score-value">0</strong>
            </div>
            <div class="stat">
              <span class="stat-label">最高分</span>
              <strong class="stat-value" id="best-value">0</strong>
            </div>
          </div>
          <button class="pause-button" id="pause-button" type="button" hidden>暂停</button>
        </div>
      </header>

      <div class="play-area">
        <div class="board-wrap" id="board-wrap">
          <canvas
            id="board"
            role="img"
            tabindex="-1"
            aria-label="20乘20贪吃蛇棋盘"
            aria-describedby="board-help"
          ></canvas>

          <div
            class="overlay"
            id="idle-overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="idle-title"
          >
            <div class="overlay-card">
              <p class="eyebrow">Ready to slither?</p>
              <h2 id="idle-title">准备开吃</h2>
              <p class="overlay-copy">每颗食物加 10 分。撞墙或撞到自己，本局结束。</p>
              <p class="best-line">历史最高分 <strong id="idle-best-value">0</strong></p>
              <button class="primary-button" id="start-button" type="button">开始游戏</button>
              <p class="hint">方向键 / WASD 操作 · P 或 Esc 暂停</p>
            </div>
          </div>

          <div
            class="overlay"
            id="pause-overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="pause-title"
            hidden
          >
            <div class="overlay-card">
              <p class="eyebrow">Take a breath</p>
              <h2 id="pause-title">已暂停</h2>
              <p class="overlay-copy">蛇已停下。继续后会等待完整一步，不会补步。</p>
              <button class="primary-button" id="resume-button" type="button">继续游戏</button>
              <button class="text-button" id="restart-button" type="button">重新开始</button>
            </div>
          </div>

          <div
            class="overlay"
            id="gameover-overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="gameover-title"
            hidden
          >
            <div class="overlay-card result-card">
              <p class="eyebrow">Round complete</p>
              <h2 id="gameover-title">本局结束</h2>
              <div class="result-score">
                <span>本局得分</span>
                <strong id="final-score">0</strong>
              </div>
              <p class="best-line">历史最高分 <strong id="final-best">0</strong></p>
              <p class="record-text" id="record-text">未破纪录</p>
              <button class="primary-button" id="again-button" type="button">再来一局</button>
            </div>
          </div>
        </div>

        <aside class="controls-panel" id="controls-panel" aria-label="方向控制" hidden>
          <div class="dpad" id="dpad">
            <button class="dpad-button dpad-up" type="button" data-direction="up" aria-label="向上">
              <span aria-hidden="true">↑</span>
            </button>
            <button class="dpad-button dpad-left" type="button" data-direction="left" aria-label="向左">
              <span aria-hidden="true">←</span>
            </button>
            <button class="dpad-button dpad-down" type="button" data-direction="down" aria-label="向下">
              <span aria-hidden="true">↓</span>
            </button>
            <button class="dpad-button dpad-right" type="button" data-direction="right" aria-label="向右">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <p class="control-hint">触控方向键 · 键盘同样可用</p>
        </aside>
      </div>

      <p class="visually-hidden" id="board-help">
        使用方向键或 WASD 转向，按 P 或 Escape 暂停和继续。棋盘为 20 行 20 列。
      </p>
      <p class="visually-hidden" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
